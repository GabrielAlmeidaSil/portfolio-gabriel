
name: Commit automatico de fim de semana

on:
  schedule:
    - cron: '17 9 * * 6,0'
      timezone: 'America/Sao_Paulo'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar-status:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Atualizar status e criar commit
        run: |
          DIA=$(TZ=America/Sao_Paulo date +%u)

          if [ "$DIA" -lt 6 ]; then
            echo "Hoje nao e fim de semana."
            exit 0
          fi

          DATA=$(TZ=America/Sao_Paulo date '+%Y-%m-%d %H:%M:%S')

          echo "# Status do repositorio" > status.md
          echo "" >> status.md
          echo "Ultima atualizacao: $DATA" >> status.md

          git config user.name "GabrielAlmeidaSil"
          git config user.email "gabriel.almesilva@gmail.com"

          git add status.md

          if git diff --cached --quiet; then
            echo "Nenhuma alteracao encontrada."
            exit 0
          fi

          git commit -m "chore: atualizacao automatica do status"
          git push
